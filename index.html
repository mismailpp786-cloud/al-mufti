<!DOCTYPE html>
<html lang="ml" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>അൽ മുഫ്തി — Al Mufti | AI Islamic Knowledge Assistant</title>
  
  <meta name="theme-color" content="#073D32">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;600&family=Manjari:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-emerald: #073D32;
      --primary-dark: #04241D;
      --accent-gold: #D4AF37;
      --bg-dark: #061914;
      --bg-light: #F7F4EB;
      --surface-white: #FFFFFF;
      --surface-card: #FDFBF7;
      --text-main: #14231E;
      --text-muted: #66736B;
      --border-subtle: #E2DDD2;
      --danger: #991B1B;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Manjari', 'Inter', -apple-system, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 0%, #0d382e 0%, var(--bg-dark) 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-main);
      overflow: hidden;
    }

    .app-wrapper {
      width: 100%;
      max-width: 500px;
      height: 100vh;
      background: var(--bg-light);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    @media (min-width: 501px) {
      .app-wrapper {
        height: 94vh;
        border-radius: var(--radius-lg);
        border: 1px solid rgba(212, 175, 55, 0.25);
      }
    }

    header {
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-emerald) 100%);
      color: var(--surface-white);
      padding: 12px 16px;
      border-bottom: 2px solid var(--accent-gold);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      background: var(--accent-gold);
      color: var(--primary-dark);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: 700;
    }

    .brand-text h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #FFF;
      line-height: 1.2;
    }

    .brand-text span {
      font-size: 0.72rem;
      color: var(--accent-gold);
      display: block;
    }

    .controls-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .controls-strip::-webkit-scrollbar {
      display: none;
    }

    .pill-select-wrapper {
      position: relative;
      flex-shrink: 0;
    }

    .pill-select {
      background: rgba(4, 36, 29, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.5);
      color: #F7F4EB;
      padding: 5px 22px 5px 12px;
      border-radius: 14px;
      font-size: 0.78rem;
      font-weight: 600;
      outline: none;
      appearance: none;
      cursor: pointer;
    }

    .pill-select-wrapper::after {
      content: '▾';
      color: var(--accent-gold);
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      font-size: 0.7rem;
    }

    .chat-container {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background-color: var(--bg-light);
    }

    .quick-categories {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 4px;
    }

    .category-chip {
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 8px 4px;
      text-align: center;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--primary-emerald);
      cursor: pointer;
      transition: background 0.2s;
    }

    .category-chip:hover {
      background: #EFE9DB;
    }

    .message-row {
      display: flex;
      flex-direction: column;
      max-width: 86%;
      animation: messageSlide 0.2s ease-out forwards;
    }

    @keyframes messageSlide {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-row.user {
      align-self: flex-end;
    }

    .message-row.ai {
      align-self: flex-start;
    }

    .msg-bubble {
      padding: 12px 16px;
      font-size: 0.94rem;
      line-height: 1.6;
      border-radius: var(--radius-md);
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .user .msg-bubble {
      background: linear-gradient(135deg, var(--primary-emerald) 0%, var(--primary-dark) 100%);
      color: #FFF;
      border-bottom-right-radius: 2px;
    }

    .ai .msg-bubble {
      background: var(--surface-white);
      color: var(--text-main);
      border-bottom-left-radius: 2px;
      border: 1px solid var(--border-subtle);
    }

    .arabic-block {
      font-family: 'Amiri', serif;
      direction: rtl;
      font-size: 1.15rem;
      line-height: 1.85;
      color: #063A2F;
      display: block;
      margin: 8px 0;
      padding: 8px 12px;
      background: #FAF8F2;
      border-right: 3px solid var(--accent-gold);
      border-radius: 4px;
    }

    .timer-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--primary-emerald);
      font-weight: 600;
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid rgba(212, 175, 55, 0.4);
      padding: 4px 10px;
      border-radius: 12px;
      margin-bottom: 6px;
      width: fit-content;
    }

    .streaming-dot {
      width: 8px;
      height: 8px;
      background: var(--accent-gold);
      border-radius: 50%;
      animation: pulseDot 0.8s infinite alternate;
    }

    @keyframes pulseDot {
      from { opacity: 0.3; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1.2); }
    }

    .msg-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
      font-size: 0.72rem;
      color: var(--text-muted);
      padding: 0 4px;
    }

    .input-wrapper {
      background: var(--surface-white);
      padding: 10px 14px calc(10px + var(--safe-bottom)) 14px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .chat-textarea {
      flex: 1;
      padding: 12px 14px;
      border: 1.5px solid var(--border-subtle);
      border-radius: 24px;
      outline: none;
      font-size: 0.95rem;
      background: var(--surface-card);
    }

    .chat-textarea:focus {
      border-color: var(--primary-emerald);
      background: #FFF;
    }

    .composer-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      font-size: 1.1rem;
      transition: all 0.2s;
    }

    .mic-btn {
      background: var(--surface-card);
      border: 1.5px solid var(--border-subtle);
      color: var(--primary-emerald);
    }

    .mic-btn.listening {
      background: #FEE2E2;
      border-color: var(--danger);
      color: var(--danger);
      animation: pulseDot 0.8s infinite alternate;
    }

    .send-btn {
      background: linear-gradient(135deg, var(--primary-emerald), var(--primary-dark));
      color: var(--accent-gold);
      border: 1px solid var(--accent-gold);
    }

    .stop-btn {
      background: var(--danger);
      color: #FFF;
      display: none;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<div class="app-wrapper">
  <header>
    <div class="top-bar">
      <div class="brand-title-area">
        <div class="brand-logo">م</div>
        <div class="brand-text">
          <h1>അൽ മുഫ്തി (Al Mufti)</h1>
          <span>ആധികാരിക സുന്നി വിജ്ഞാന സഹായി</span>
        </div>
      </div>
    </div>

    <div class="controls-strip">
      <div class="pill-select-wrapper">
        <select id="madhhabSelect" class="pill-select">
          <option value="shafii" selected>മദ്ഹബ്: ശാഫിഈ (Default)</option>
          <option value="hanafi">മദ്ഹബ്: ഹനഫീ</option>
          <option value="maliki">മദ്ഹബ്: മാലികീ</option>
          <option value="hanbali">മദ്ഹബ്: ഹംബലീ</option>
          <option value="comparative">താരതമ്യം (Comparative 4)</option>
        </select>
      </div>

      <div class="pill-select-wrapper">
        <select id="langSelect" class="pill-select">
          <option value="auto" selected>ഭാഷ: Automatic</option>
          <option value="malayalam">മലയാളം (Malayalam)</option>
          <option value="manglish">Manglish (മംഗ്ലീഷ്)</option>
          <option value="arabic">العربية (Arabic)</option>
          <option value="english">English</option>
        </select>
      </div>
    </div>
  </header>

  <main class="chat-container" id="chatStream">
    <section class="quick-categories">
      <div class="category-chip" onclick="quickFill('വുളൂഇന്റെ ഫർളുകൾ ഏതൊക്കെയാണ്?')">🕌 ഫിഖ്ഹ്</div>
      <div class="category-chip" onclick="quickFill('ആയത്തുൽ കുർസിയുടെ മഹത്വം എന്താണ്?')">📖 ഖുർആൻ</div>
      <div class="category-chip" onclick="quickFill('നിയ്യത്തിനെക്കുറിച്ചുള്ള ഹദീസ് ഏതാണ്?')">📜 ഹദീസ്</div>
      <div class="category-chip" onclick="quickFill('രാവിലെയുള്ള പ്രധാന ദിക്റുകൾ ഏവ?')">🤲 ദിക്ർ</div>
    </section>

    <article class="message-row ai">
      <div class="msg-bubble">അസ്സലാമു അലൈക്കും വരഹ്‌മത്തുല്ലാഹ്. ഞാൻ <strong>അൽ മുഫ്തി</strong>. അഹ്‌ലുസ്സുന്നത്തി വൽ ജമാഅത്തിന്റെ വീക്ഷണത്തിലുള്ള സംശയങ്ങൾ മലയാളത്തിലോ മംഗ്ലീഷിലോ ചോദിക്കാം.</div>
    </article>
  </main>

  <footer class="input-wrapper">
    <!-- Voice Recognition Button -->
    <button id="micBtn" class="composer-btn mic-btn" onclick="toggleSpeech()" title="ശബ്ദത്തിലൂടെ ചോദിക്കൂ">🎙️</button>
    <input type="text" id="promptInput" class="chat-textarea" placeholder="സംശയങ്ങൾ ചോദിക്കുക അല്ലെങ്കിൽ വോയ്‌സ് നൽകുക..." onkeydown="handleKey(event)" autocomplete="off">
    <button id="sendBtn" class="composer-btn send-btn" onclick="submitFastQuery()" title="ചോദിക്കൂ">➤</button>
    <button id="stopBtn" class="composer-btn stop-btn" onclick="cancelCurrentQuery()" title="നിർത്തുക">⏹</button>
  </footer>
</div>

<script>
  const API_KEY = "AQ.Ab8RN6KAkbjS6ld1GBANt-hH4jinfymIhj7Jyczc0ropZPJrEg";
  let activeAbortController = null;
  let activeTimerInterval = null;
  let recognition = null;
  let isListening = false;

  // Initialize Speech Recognition
  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = 'ml-IN';

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      const input = document.getElementById("promptInput");
      input.value = transcript;
      stopListeningUI();
      submitFastQuery();
    };

    recognition.onerror = () => {
      stopListeningUI();
    };

    recognition.onend = () => {
      stopListeningUI();
    };
  }

  function toggleSpeech() {
    if (!recognition) {
      alert("നിങ്ങളുടെ ബ്രൗസറിൽ മൈക്രോഫോൺ സൗകര്യം ലഭ്യമല്ല.");
      return;
    }
    if (isListening) {
      recognition.stop();
      stopListeningUI();
    } else {
      try {
        const langChoice = document.getElementById("langSelect").value;
        recognition.lang = (langChoice === 'english') ? 'en-US' : (langChoice === 'arabic') ? 'ar-SA' : 'ml-IN';
        recognition.start();
        isListening = true;
        const micBtn = document.getElementById("micBtn");
        micBtn.classList.add("listening");
        micBtn.innerText = "🛑";
      } catch (e) {
        stopListeningUI();
      }
    }
  }

  function stopListeningUI() {
    isListening = false;
    const micBtn = document.getElementById("micBtn");
    if (micBtn) {
      micBtn.classList.remove("listening");
      micBtn.innerText = "🎙️";
    }
  }

  function quickFill(val) {
    const input = document.getElementById("promptInput");
    input.value = val;
    input.focus();
  }

  function handleKey(e) {
    if (e.key === "Enter") {
      e.preventDefault();
      submitFastQuery();
    }
  }

  function cancelCurrentQuery() {
    if (activeAbortController) {
      activeAbortController.abort();
    }
  }

  async function submitFastQuery() {
    const input = document.getElementById("promptInput");
    const query = input.value.trim();
    if (!query) return;

    if (isListening && recognition) {
      recognition.stop();
      stopListeningUI();
    }

    const sendBtn = document.getElementById("sendBtn");
    const stopBtn = document.getElementById("stopBtn");
    const micBtn = document.getElementById("micBtn");
    const stream = document.getElementById("chatStream");

    appendUserMessage(query);
    input.value = "";
    sendBtn.style.display = "none";
    micBtn.style.display = "none";
    stopBtn.style.display = "flex";

    const aiRow = document.createElement("article");
    aiRow.className = "message-row ai";

    const timerBadge = document.createElement("div");
    timerBadge.className = "timer-indicator";
    timerBadge.innerHTML = `<span class="streaming-dot"></span> <span class="timer-text">ആലോചിക്കുന്നു... 0.0s</span>`;

    const bubble = document.createElement("div");
    bubble.className = "msg-bubble";

    const meta = document.createElement("div");
    meta.className = "msg-meta";

    aiRow.appendChild(timerBadge);
    aiRow.appendChild(bubble);
    aiRow.appendChild(meta);
    stream.appendChild(aiRow);
    stream.scrollTop = stream.scrollHeight;

    const startTime = performance.now();
    activeTimerInterval = setInterval(() => {
      const elapsed = ((performance.now() - startTime) / 1000).toFixed(1);
      const timerText = timerBadge.querySelector(".timer-text");
      if (timerText) {
        timerText.innerText = `ഉത്തരം കണ്ടെത്തുന്നു... ${elapsed}s`;
      }
    }, 100);

    activeAbortController = new AbortController();

    const madhhab = document.getElementById("madhhabSelect").value;
    const lang = document.getElementById("langSelect").value;

    const systemPrompt = `നിങ്ങൾ 'അൽ മുഫ്തി' എന്ന ആധികാരിക സുന്നി ഇസ്‌ലാമിക് AI അസിസ്റ്റന്റാണ്.
മദ്ഹബ്: ${madhhab} (ശാഫിഈ മദ്ഹബ്, സമസ്ത വീക്ഷണം പ്രധാനം).
ഭാഷാ നിർദ്ദേശം: ${lang}. മംഗ്ലീഷിലോ മലയാളത്തിലോ ചോദിച്ചാൽ വ്യക്തമായ മലയാളത്തിൽ മറുപടി നൽകുക. 
അനാവശ്യ ദീർഘിപ്പിക്കലുകൾ ഒഴിവാക്കി ഏറ്റവും കൃത്യവും ആധികാരികവുമായ കാര്യങ്ങൾ മാത്രം വേഗത്തിൽ വ്യക്തമാക്കുക.`;

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${API_KEY}`, {
        method: "POST",
        signal: activeAbortController.signal,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{
            parts: [{ text: `${systemPrompt}\n\nചോദ്യം: ${query}` }]
          }],
          generationConfig: {
            temperature: 0.25,
            maxOutputTokens: 1000
          }
        })
      });

      const data = await response.json();
      const totalElapsed = ((performance.now() - startTime) / 1000).toFixed(1);

      if (data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
        timerBadge.style.display = "none";
        bubble.innerHTML = formatArabicAndBreaks(data.candidates[0].content.parts[0].text);
        meta.innerHTML = `<span>പൂർത്തിയായി (${totalElapsed}s)</span>`;
      } else if (data.error) {
        throw new Error(data.error.message);
      } else {
        throw new Error("മറുപടി ലഭ്യമായില്ല.");
      }

    } catch (err) {
      const totalElapsed = ((performance.now() - startTime) / 1000).toFixed(1);
      timerBadge.style.display = "none";
      if (err.name === 'AbortError') {
        meta.innerHTML = `<span style="color:var(--danger)">നിർത്തലാക്കി (${totalElapsed}s)</span>`;
      } else {
        bubble.innerHTML = `<span style="color:var(--danger)">തകരാർ: ${err.message}</span>`;
      }
    } finally {
      clearInterval(activeTimerInterval);
      activeTimerInterval = null;
      activeAbortController = null;
      sendBtn.style.display = "flex";
      micBtn.style.display = "flex";
      stopBtn.style.display = "none";
      stream.scrollTop = stream.scrollHeight;
    }
  }

  function appendUserMessage(text) {
    const stream = document.getElementById("chatStream");
    const row = document.createElement("article");
    row.className = "message-row user";
    row.innerHTML = `<div class="msg-bubble">${escapeHTML(text)}</div>`;
    stream.appendChild(row);
  }

  function formatArabicAndBreaks(text) {
    const escaped = escapeHTML(text);
    const arabicRegex = /([\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\s.,،؟!]{10,})/g;
    return escaped.replace(arabicRegex, m => `<span class="arabic-block">${m.trim()}</span>`).replace(/\n/g, "<br>");
  }

  function escapeHTML(str) {
    return str.replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t));
  }

  // Register PWA Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
